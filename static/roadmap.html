<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研发进度规划 - 本地项目管理</title>
  <link rel="stylesheet" href="/static/roadmap.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="back-link">← 返回项目列表</a>
      <a href="/timeline" class="back-link">可编辑时间轴 →</a>
    </div>
    <h1 id="page-title">研发进度规划</h1>
    <div class="topbar-right">
      <button id="btn-undo" class="btn btn-sm" title="撤销 (Cmd+Z)" disabled>↩ 撤销</button>
      <button id="btn-today" class="btn btn-sm" title="滚动定位到今天">今天</button>
      <button id="btn-backup" class="btn btn-sm">备份 JSON</button>
      <button id="btn-export" class="btn btn-sm" title="打印 / 导出 PDF">打印 / PDF</button>
      <div class="zoom-switch" id="zoom-switch">
        <button type="button" data-zoom="day">日</button>
        <button type="button" data-zoom="week">周</button>
        <button type="button" data-zoom="month">月</button>
      </div>
      <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="container">
    <div id="save-notice" class="save-notice hidden" role="alert">
      <span id="save-message"></span>
      <button id="btn-retry" class="btn btn-sm">重试保存</button>
      <button id="btn-draft" class="btn btn-sm">下载本页草稿</button>
      <button id="btn-reload" class="btn btn-sm">加载最新版本</button>
    </div>
    <div class="gantt-wrap">
      <div id="gantt" class="gantt">
        <!-- 动态生成 -->
      </div>
    </div>
  </main>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h2 id="modal-title">编辑任务</h2>
      <form id="item-form">
        <input type="hidden" id="item-lane-idx">
        <input type="hidden" id="item-idx">
        <label>
          任务名称
          <input type="text" id="item-name" required>
        </label>
        <label>
          关联项目任务（可选）
          <select id="item-task-link"><option value="">不关联</option></select>
        </label>
        <p class="field-hint">进度 100% 表示关联任务完成；取消完成会将 100% 重置为 0%。</p>
        <div class="form-row">
          <label>
            开始日期
            <input type="date" id="item-start" required>
          </label>
          <label>
            结束日期
            <input type="date" id="item-end" required>
          </label>
        </div>
        <label>
          进度（<span id="item-progress-val">0</span>%）
          <input type="range" id="item-progress" min="0" max="100" step="5" value="0">
        </label>
        <label>
          里程碑（每行一个，格式：YYYY-MM-DD 名称）
          <textarea id="item-milestones" rows="4" placeholder="2026-07-20 项目立项&#10;2026-08-15 传感器布局确认"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-delete-item" class="btn danger">删除任务</button>
          <div class="right-actions">
            <button type="button" id="btn-modal-cancel" class="btn">取消</button>
            <button type="submit" class="btn primary">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/save-queue.js"></script>
  <script src="/static/roadmap.js"></script>
</body>
</html>
