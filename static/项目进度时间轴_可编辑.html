<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目时间轴</title>
<style>
:root{color-scheme:light;--ink:#172136;--muted:#647086;--border:#e1e6ee;--purple:#7354ba;--purple-weak:#efe8ff;--bg:#f5f7fb;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
#app{height:100vh;min-height:600px;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{background:#eee7ff;color:#7650b9;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:21px;font-weight:800}.brand-title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-sub{color:var(--muted);font-size:12px;margin-top:3px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}button{font:inherit;border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer;color:#334155;font-size:13px;white-space:nowrap}button:hover{background:#f7f3ff;border-color:#cbbaf0}button.active,.primary{background:var(--purple);border-color:var(--purple);color:white}button.active:hover,.primary:hover{background:#5f42aa}button:disabled{opacity:.4;cursor:not-allowed}.divider{width:1px;background:var(--border);height:24px;margin:0 2px}
.workspace{display:flex;min-height:0;flex:1}.leftbar{width:72px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:8px}.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;font-size:11px;color:#56637a}.tool .glyph{font-size:20px;line-height:22px}.tool.active{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.canvas-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 16px;background:#fafbff;border-bottom:1px solid var(--border)}.canvas-title{font-size:13px;font-weight:600;color:#42516a}.hint{font-size:12px;color:#75839a}.stage-wrap{flex:1;min-height:0;position:relative;overflow:hidden;background-color:#edf0f6;background-image:radial-gradient(#cfd6e2 0.8px,transparent .8px);background-size:20px 20px}#stage{display:block;width:100%;height:100%;touch-action:none;user-select:none}#stage.grab{cursor:grab}#stage.grabbing{cursor:grabbing}#stage.mode-text,#stage.mode-node,#stage.mode-arrow,#stage.mode-curve{cursor:crosshair}
.bottom{padding:8px 16px;background:#fff;border-top:1px solid var(--border);color:#708098;font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.inspector{width:260px;flex-shrink:0;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:auto}.inspector-header{font-size:14px;font-weight:750;padding:17px 18px;border-bottom:1px solid var(--border)}.inspect-content{padding:16px;display:flex;flex-direction:column;gap:13px}.subtle{color:#8290a3;font-size:12px;line-height:1.75}.formlabel{font-size:12px;color:#66758d;margin-bottom:5px;display:block}.field,textarea,select{width:100%;border:1px solid #d8dee9;border-radius:8px;background:#fff;color:#273449;font:inherit;font-size:13px;padding:9px;outline:none}.field:focus,textarea:focus,select:focus{border-color:#9371d0;box-shadow:0 0 0 3px #eee7fb}textarea{min-height:105px;resize:vertical;line-height:1.55}.row{display:flex;gap:8px}.row>label{flex:1;min-width:0}.small{padding:7px 9px;font-size:12px}.danger{color:#c63347;border-color:#f0c9cf}.danger:hover{background:#fff2f4;border-color:#dc9fa9}.boxhint{background:#f6f3fc;border-radius:9px;padding:10px;color:#655a81;font-size:12px;line-height:1.7}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#253047;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 12px 32px #18233b30;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;font-size:13px}#toast.show{opacity:1}
.dialog-backdrop{position:fixed;inset:0;background:#101c32aa;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.dialog-backdrop.show{display:flex}.dialog{background:white;border-radius:14px;padding:22px;width:410px;max-width:100%;box-shadow:0 18px 70px #15203855}.dialog h3{margin:0 0 9px}.dialog p{color:#748094;font-size:13px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.month-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:#54627a}
.month-controls label{display:flex;align-items:center;gap:5px;white-space:nowrap}
.month-controls input{width:142px;padding:6px 7px;border:1px solid #cfd7e5;border-radius:7px;background:white;color:#293348;font-size:12px}
.month-controls #monthCount{width:55px}.month-controls button{font-size:12px;padding:6px 9px}
.month-controls input:disabled,.month-controls button:disabled{opacity:.48}
.month-guide{display:flex;align-items:center;gap:9px;padding:6px 16px;background:#f5f0ff;border-bottom:1px solid #e6dafa;color:#5b418c;font-size:12px;flex-wrap:wrap}
.text-color-palette{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}.color-swatch{height:28px;min-width:0;padding:0;border:2px solid transparent;border-radius:6px;background:var(--swatch);color:#fff;font-size:15px;font-weight:700;line-height:24px}.color-swatch:hover{background:var(--swatch);border-color:#94a3b8}.color-swatch[aria-pressed="true"]{outline:2px solid #7354ba;outline-offset:2px;border-color:#fff}.color-swatch:focus-visible{outline:2px solid #172136;outline-offset:2px}
.node-legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:7px 16px;background:#fff;border-bottom:1px solid var(--border);font-size:12px;color:#59657a}.node-legend span{display:inline-flex;align-items:center;gap:5px}.legend-dot{display:inline-block;border-radius:50%;width:12px;height:12px;background:#eadcf9;border:1px solid #695779}.legend-dot.todo{width:5px;height:5px}.legend-dot.high{background:#ef4444;border-color:#b91c1c}.legend-dot.medium{background:#facc15;border-color:#a16207}.legend-dot.low{background:#22c55e;border-color:#15803d}
.month-guide .dot{width:10px;height:10px;background:#ad8be7;border-radius:3px;display:inline-block}
.brand-title{display:block;max-width:100%;border:0;background:transparent;padding:0;text-align:left;font-size:inherit;color:var(--ink);cursor:pointer}.brand-title:hover{background:#f7f3ff;color:var(--purple)}.brand-title::after{content:" ✎";color:var(--purple);font-size:13px}.brand-title:focus-visible{outline:2px solid var(--purple);outline-offset:4px}
#editMode{font-weight:700}.only-edit[disabled]{opacity:.35}@media(max-width:1100px){.inspector{width:222px}.topbar{padding:9px}.brand-sub{display:none}.toolbar button{padding:7px 9px}}@media(max-width:760px){.topbar{align-items:flex-start;flex-direction:column}.toolbar{justify-content:flex-start}.leftbar{width:57px}.tool{font-size:10px}.tool .glyph{font-size:17px}.inspector{position:absolute;right:0;top:120px;bottom:30px;z-index:3;box-shadow:-5px 0 18px #1720361a;display:none}.inspector.show{display:flex}.main{width:100%}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">↗</div><div><button type="button" class="brand-title" id="brandTitle" title="点击修改项目名称" aria-label="修改项目名称">项目时间轴</button><div class="brand-sub">一个文件即可查看 · 无需安装 · 编辑数据保存在本机</div></div></div>
    <div class="toolbar">
      <button id="editMode" class="primary" title="查看者默认不能误拖动，点击进入编辑模式">✎ 进入编辑</button>
      <button id="undo" title="撤销 Ctrl/⌘+Z" disabled>↶ 撤销</button>
      <button id="redo" title="重做 Ctrl/⌘+Shift+Z" disabled>↷ 重做</button>
      <span class="divider"></span>
      <button id="fit" title="适配全部内容">适配</button><button id="zoomOut">−</button><button id="zoomIn">＋</button>
      <span class="divider"></span>
      <button id="shareHtml" class="primary" title="把当前所有修改直接写入独立HTML，发送文件给同事即可查看">保存可分享 HTML</button>
      <button id="saveJson" title="保存完整编辑数据为JSON">保存项目</button><button id="openJson" title="打开项目JSON">打开项目</button>
      <button id="exportSvg" title="导出无损矢量图片">导出 SVG</button><button id="exportPng" title="导出高清图片">导出 PNG</button>
      <button id="reset" title="恢复示例图">重置示例</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="leftbar" id="tools">
      <button class="tool active" data-tool="select" title="选择后拖动；双击文字编辑"><span class="glyph">↖</span>选择</button>
      <button class="tool only-edit" data-tool="node" title="在画布任意位置点击添加里程碑"><span class="glyph">◉</span>节点</button>
      <button class="tool only-edit" data-tool="text" title="在画布任意位置点击添加文字"><span class="glyph">Ｔ</span>文字</button>
      <button class="tool only-edit" data-tool="arrow" title="点击起点，再点击终点添加箭头"><span class="glyph">↗</span>折线</button>
      <button class="tool only-edit" data-tool="curve" title="依次点击两个节点创建曲线箭头，再拖动控制点调整弧度"><span class="glyph">⤴</span>曲线</button>
      <button class="tool" data-tool="hand" title="拖动画布"><span class="glyph">✥</span>平移</button>
      <div style="flex:1"></div>
      <button class="tool only-edit" id="addLane" title="新增工作泳道"><span class="glyph">☰＋</span>泳道</button>
    </aside>
    <main class="main">
      <div class="canvas-head"><span class="canvas-title" id="rangeTitle">2026 年 · 项目进度</span>
        <div class="month-controls">
          <label>从 <input type="month" id="startMonth" title="指定时间轴的第一个月份"></label>
          <label>显示 <input type="number" id="monthCount" min="1" max="24" step="1" title="显示几个月"> 个月</label>
          <button id="removeMonth" class="only-edit" title="减少一个月">− 月份</button>
          <button id="addMonth" class="only-edit" title="增加一个月">＋ 月份</button>
          <button id="focusMonth" class="only-edit" title="把当前系统月份放宽到至少520像素，其他月份不变">放宽当前月</button>
        </div>
      </div>
      <div class="month-guide"><span class="dot"></span><span id="modeHint">查看模式：点击「进入编辑」后，即可修改月份和任务</span><span style="color:#8a789e">编辑时：拖动月份上方的紫色分界手柄调整宽度；点击月份可精确输入宽度；拖动泳道横线可上下调整</span></div>
      <div class="node-legend" aria-label="节点图例"><span><i class="legend-dot high"></i>红色：风险极大</span><span><i class="legend-dot medium"></i>黄色：有风险</span><span><i class="legend-dot low"></i>绿色：无风险</span><span><i class="legend-dot"></i>紫色：未标记风险</span><span><i class="legend-dot"></i>大圆：重要里程碑</span><span><i class="legend-dot todo"></i>小圆：事项 / Todo</span></div>
      <div class="stage-wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 960" aria-label="交互式项目时间轴"></svg></div>
      <div class="bottom"><span id="status">示例数据 · 鼠标滚轮缩放 · 点击「进入编辑」开始修改</span><span id="zoomStatus">100%</span></div>
    </main>
    <aside class="inspector" id="inspector"><div class="inspector-header">属性编辑 <button class="small" id="closeInspector" style="float:right;display:none">关闭</button></div><div class="inspect-content" id="inspectContent"></div></aside>
  </div>
</div>
<input type="file" id="fileInput" accept=".json,application/json" hidden />
<div class="dialog-backdrop" id="dialogBack"><div class="dialog"><h3 id="dialogTitle">编辑文字</h3><p id="dialogInfo">修改后点击确定。</p><textarea id="dialogText" rows="6"></textarea><div class="dialog-actions"><button id="dialogCancel">取消</button><button id="dialogOk" class="primary">确定</button></div></div></div>
<div id="toast"></div>
<script>
(async()=>{'use strict';
const NS='http://www.w3.org/2000/svg';
const $=(id)=>document.getElementById(id);
const clone=(x)=>JSON.parse(JSON.stringify(x));
const uid=(prefix)=>prefix+'_'+Math.random().toString(36).slice(2,10);
const monthStart=230, MIN_MONTH=120, MAX_MONTH=1400;
const RISK_LEVELS={unset:{label:'未标记风险',color:'#eadcf9',stroke:'#695779'},high:{label:'风险极大',color:'#ef4444',stroke:'#b91c1c'},medium:{label:'有风险',color:'#facc15',stroke:'#a16207'},low:{label:'无风险',color:'#22c55e',stroke:'#15803d'}};
const NODE_TYPES={milestone:{label:'重要里程碑',radius:8.8},todo:{label:'事项 / Todo',radius:3.5}};
function nodeRisk(node){return Object.hasOwn(RISK_LEVELS,node.risk)?RISK_LEVELS[node.risk]:RISK_LEVELS.unset;}
function nodeType(node){return Object.hasOwn(NODE_TYPES,node.kind)?NODE_TYPES[node.kind]:NODE_TYPES.milestone;}

function monthName(m){return `${m.year} 年 ${m.month} 月`}
function monthList(year,month,count,widths=[]){return Array.from({length:count},(_,i)=>{
 const d=new Date(year,month-1+i,1);return {year:d.getFullYear(),month:d.getMonth()+1,width:widths[i]||280};
});}
function monthRight(months){return monthStart+months.reduce((v,m)=>v+m.width,0)}
function mappedX(x,oldMonths,newMonths,scaleAll=false){
 if(x<monthStart)return x;
 const oldEnd=monthRight(oldMonths),newEnd=monthRight(newMonths);
 if(x>=oldEnd)return x+newEnd-oldEnd;
 if(scaleAll)return monthStart+(x-monthStart)*(newEnd-monthStart)/(oldEnd-monthStart);
 let oldX=monthStart,newX=monthStart;
 for(let i=0;i<oldMonths.length;i++){
  if(x<=oldX+oldMonths[i].width || i===oldMonths.length-1){
   const corresponding=newMonths[Math.min(i,newMonths.length-1)];
   return newX+(x-oldX)*(corresponding.width/oldMonths[i].width);
  }
  oldX+=oldMonths[i].width;newX+=newMonths[Math.min(i,newMonths.length-1)].width;
 }
 return x;
}
function changeMonthShape(oldMonths,newMonths,scaleAll=false){
 for(const n of data.nodes)n.x=Math.round(mappedX(n.x,oldMonths,newMonths,scaleAll));
 for(const t of data.texts)t.x=Math.round(mappedX(t.x,oldMonths,newMonths,scaleAll));
 for(const a of data.arrows)for(const p of a.points)p.x=Math.round(mappedX(p.x,oldMonths,newMonths,scaleAll));
 data.months=newMonths;
 data.view.w=Math.max(800,monthRight(newMonths)+115);
}
function makeExample(){return {version:2,title:'具身智能导航项目',year:2026,
 months:monthList(2026,10,3,[440,300,300]),view:{w:1385,h:1020},
 lanes:[{id:'base',name:'基建',y:283},{id:'model',name:'模型',y:447},{id:'deploy',name:'部署',y:613},{id:'test',name:'测试',y:763},{id:'device',name:'平台与设备',y:912}],
 nodes:[
 {id:'n1',x:367,y:283,title:'完成数据接口定义'},{id:'n2',x:586,y:283,title:'数据集与采集链路打通'},{id:'n3',x:790,y:283,title:'新场景数据入库'},{id:'n4',x:1160,y:283,title:'数据覆盖率检查'},
 {id:'n5',x:438,y:447,title:'训练框架初版'},{id:'n6',x:640,y:447,title:'10月阶段训练'},{id:'n7',x:865,y:447,title:'11月模型验证'},{id:'n8',x:1125,y:447,title:'12月版本验收'},
 {id:'n9',x:510,y:613,title:'设备部署链路'},{id:'n10',x:868,y:613,title:'真机联调'},{id:'n11',x:1130,y:613,title:'版本集成'},
 {id:'n12',x:405,y:763,title:'测试环境准备'},{id:'n13',x:850,y:763,title:'回归测试'},{id:'n14',x:1135,y:763,title:'场景验收'},
 {id:'n15',x:530,y:912,title:'算力与平台部署'},{id:'n16',x:1050,y:912,title:'硬件资源评审'}],
 texts:[
 {id:'t1',x:415,y:124,text:'10 月为当前重点阶段：\n可拖动月边界加宽显示范围',fontSize:13,align:'middle',weight:500},
 {id:'t2',x:895,y:125,text:'11 月：模型与真机验证',fontSize:13,align:'middle'},
 {id:'t3',x:1150,y:125,text:'12 月：版本收敛与验收',fontSize:13,align:'middle'},
 {id:'t4',x:315,y:336,text:'需求评审、数据接口设计\n采集工具打通',fontSize:12,align:'start'},
 {id:'t5',x:620,y:336,text:'数据标注与样本准备\n逐步完善数据规范',fontSize:12,align:'start'},
 {id:'t6',x:800,y:336,text:'新增场景采集与整理',fontSize:12,align:'start'},
 {id:'t7',x:1110,y:336,text:'数据质量与覆盖率\n复核',fontSize:12,align:'start'},
 {id:'t8',x:424,y:500,text:'训练框架与数据加载\n阶段目标：链路跑通',fontSize:12,align:'middle'},
 {id:'t9',x:655,y:500,text:'训练、消融实验\n效果仍需持续验证',fontSize:12,align:'middle'},
 {id:'t10',x:870,y:500,text:'模型效果评估\n复杂场景测试',fontSize:12,align:'middle'},
 {id:'t11',x:1125,y:500,text:'版本冻结前\n完成指标评估',fontSize:12,align:'middle'},
 {id:'t12',x:510,y:669,text:'端侧运行环境搭建\n打通模型部署与推理',fontSize:12,align:'middle'},
 {id:'t13',x:865,y:669,text:'硬件部署及真机联调\n检查端侧性能瓶颈',fontSize:12,align:'middle'},
 {id:'t14',x:1128,y:669,text:'软硬件版本集成',fontSize:12,align:'middle'},
 {id:'t15',x:405,y:812,text:'构建仿真测试用例',fontSize:12,align:'middle'},
 {id:'t16',x:850,y:812,text:'回归测试与问题收敛',fontSize:12,align:'middle'},
 {id:'t17',x:1130,y:812,text:'目标场景验证',fontSize:12,align:'middle'},
 {id:'t18',x:530,y:960,text:'完成算力和设备资源准备',fontSize:12,align:'middle'},
 {id:'t19',x:1046,y:960,text:'评审后续资源需求',fontSize:12,align:'middle'}],
 arrows:[
 {id:'a1',points:[{x:415,y:130},{x:415,y:185},{x:586,y:185},{x:586,y:270}]},
 {id:'a2',points:[{x:895,y:130},{x:895,y:188},{x:865,y:188},{x:865,y:433}]},
 {id:'a3',points:[{x:1150,y:130},{x:1150,y:260}]},
 {id:'a4',points:[{x:367,y:333},{x:367,y:298}]},
 {id:'a5',points:[{x:640,y:496},{x:640,y:462}]},
 {id:'a6',points:[{x:866,y:666},{x:866,y:627}]}]
};}
const sharedMode=Boolean(document.querySelector('#timelineServerConfig'));
const storageKey=sharedMode?'project-timeline-shared-cache': 'project-timeline-standalone-v2';
let draftKey='project-timeline-shared-draft';
if(sharedMode){try{let client=sessionStorage.getItem('timeline-client-id');if(!client){client=uid('tab');sessionStorage.setItem('timeline-client-id',client);}draftKey+=':'+client;}catch(e){}}
let saveQueue=null,serverRevision='empty',sharedDraft=null,sharedNotice='',syncBusy=false,editorName='',sharedMeta={},historyOpen=false;
try{editorName=localStorage.getItem('timeline-editor-name')||'';}catch(e){}
async function sharedRequest(method='GET',body){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const response=await fetch('/api/timeline',{method,cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:controller.signal});
  const result=await response.json();
  if(!response.ok){const error=new Error(result.error||'服务器请求失败');error.status=response.status;throw error;}
  return result;
 }finally{clearTimeout(timer);}
}
let data=makeExample();
if(sharedMode){
 try{
  const initial=await sharedRequest();serverRevision=initial.revision;sharedMeta=initial;
  if(initial.timeline){if(!valid(initial.timeline))throw new Error('服务器项目格式无效');data=initial.timeline;}
  else sharedNotice='尚未导入共享项目，请使用「打开项目」导入已有 JSON。';
  try{sharedDraft=JSON.parse(localStorage.getItem(draftKey));}catch(e){}
  if(sharedDraft&&valid(sharedDraft.timeline)){
   if(sharedDraft.revision===serverRevision){data=sharedDraft.timeline;sharedNotice=editorName?'已恢复本机未保存草稿，正在同步。':'已恢复本机草稿，请填写编辑姓名后继续保存。';}
   else sharedNotice='发现未保存的本机草稿。服务器已有新版本，请先下载草稿保留修改。';
  }else sharedDraft=null;

 snapshot();setMonthWidth(idx,Math.max(520,data.months[idx].width+100));selection={type:'month',id:idx};safeSave();fit();toast(`${monthName(data.months[idx])} 已加宽，可以继续拖动手柄`);
};
$('undo').onclick=undo;$('redo').onclick=redo;
$('fit').onclick=fit;$('zoomIn').onclick=()=>zoom(.85);$('zoomOut').onclick=()=>zoom(1.15);
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{if(!editing&&b.dataset.tool!=='hand')return;setTool(b.dataset.tool);}));
$('addLane').onclick=()=>{if(!editing)return;const name=prompt('请输入新工作线名称（例如：安全、硬件、算法）：');if(!name||!name.trim())return;snapshot();const prev=data.lanes.at(-1)?.y||894;const y=prev+144;data.lanes.push({id:uid('lane'),name:name.trim(),y});data.view.h=Math.max(data.view.h,y+85);safeSave();fit();toast('泳道已添加');};
$('closeInspector').onclick=()=>$('inspector').classList.remove('show');
$('shareHtml').onclick=()=>{
 const copied=document.documentElement.cloneNode(true);
 copied.querySelector('#embeddedProjectData')?.remove();
 copied.querySelector('#timelineServerConfig')?.remove();copied.querySelector('#timelineSaveQueue')?.remove();copied.querySelector('#sharedSync')?.remove();copied.querySelector('#timelineHistory')?.remove();
 copied.querySelector('#stage')?.replaceChildren();
 copied.querySelector('#inspectContent')?.replaceChildren();
 const mainScript=copied.querySelector('script:not([type])');
 const seed=document.createElement('script');seed.id='embeddedProjectData';seed.type='application/json';
 seed.textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 mainScript.parentNode.insertBefore(seed,mainScript);
 const output='<!doctype html>\n'+copied.outerHTML;
 downloadFile((data.title||'项目进度图')+'_可分享.html',output,'text/html;charset=utf-8');
 toast('已把当前编辑数据打包进 HTML，同事打开此文件即可查看完整内容');
};
$('saveJson').onclick=()=>{downloadFile((data.title||'项目进度图')+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('已保存项目 JSON，可用于下次继续编辑');};
$('openJson').onclick=()=>{if(sharedMode&&!editorName)askEditor(()=>$('fileInput').click());else $('fileInput').click();};$('fileInput').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!valid(d))throw new Error('缺少所需数据字段');snapshot();data=d;normalizeMonths();selection=null;safeSave();fit();toast('项目已载入');}catch(e){alert('无法打开文件：'+e.message);}ev.target.value='';});
$('reset').onclick=()=>{if(!confirm('要恢复初始示例吗？当前修改会被替换。建议先保存项目 JSON。'))return;snapshot();data=makeExample();selection=null;safeSave();fit();toast('已恢复示例图');};
function downloadFile(name,content,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),600);}
function legendColumns(){return Math.max(1,Math.min(6,Math.floor((data.view.w-100)/195)));}
function exportHeight(){return data.view.h+Math.ceil(6/legendColumns())*28+16;}
function drawExportLegend(root){
 const columns=legendColumns();
 const entries=[['#ef4444',6,'红色：风险极大'],['#facc15',6,'黄色：有风险'],['#22c55e',6,'绿色：无风险'],['#eadcf9',6,'紫色：未标记风险'],['#eadcf9',8.8,'重要里程碑'],['#eadcf9',3.5,'事项 / Todo']];
 entries.forEach(([color,r,text],i)=>{const x=55+(i%columns)*195,y=data.view.h+18+Math.floor(i/columns)*28;svg('circle',{cx:x,cy:y,r,fill:color,stroke:'#647086','stroke-width':1},root);linesText(root,x+15,y+4,text,12,'start');});
}
function exportSvgString(){ensureCanvasHeight();const node=document.createElementNS(NS,'svg');node.setAttribute('xmlns',NS);node.setAttribute('width',data.view.w);node.setAttribute('height',exportHeight());node.setAttribute('viewBox',`0 0 ${data.view.w} ${exportHeight()}`);node.setAttribute('style','background:white');markerDefs(node);forExportMode=true;const keep=selection;selection=null;renderBase(node,true);drawObjects(node);drawToday(node,true);drawExportLegend(node);selection=keep;forExportMode=false;return new XMLSerializer().serializeToString(node);}
$('exportSvg').onclick=()=>{downloadFile((data.title||'项目进度图')+'.svg',exportSvgString(),'image/svg+xml;charset=utf-8');toast('SVG 矢量图已导出');};
$('exportPng').onclick=()=>{const url=URL.createObjectURL(new Blob([exportSvgString()],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();img.onload=()=>{const scale=2;const c=document.createElement('canvas');c.width=data.view.w*scale;c.height=exportHeight()*scale;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>{if(blob)downloadFile((data.title||'项目进度图')+'.png',blob,'image/png');URL.revokeObjectURL(url);toast('高清 PNG 已导出');},'image/png');};img.onerror=()=>{URL.revokeObjectURL(url);alert('PNG 导出失败，请改用 SVG。');};img.src=url;};
document.addEventListener('keydown',ev=>{
 if($('dialogBack').classList.contains('show')){if(ev.key==='Escape')$('dialogCancel').click();return;}
 if(historyOpen){if(ev.key==='Escape'){const panel=$('timelineHistory');panel?.classList.remove('show');historyOpen=false;}return;}
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
 if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();if(editing)(ev.shiftKey?redo:undo)();}
 if((ev.key==='Delete'||ev.key==='Backspace')&&editing&&selection){ev.preventDefault();deleteSelected();}
 if(ev.key==='Escape'){selection=null;arrowStart=null;setTool(editing?'select':'hand');}
 });
window.addEventListener('resize',()=>render());
let displayedDay=new Date().toDateString();
setInterval(()=>{const day=new Date().toDateString();if(day!==displayedDay&&!drag){displayedDay=day;renderVisualOnly();}},60000);
function askEditor(after){
 showDialog('填写编辑姓名（自行填写，非账号认证）',editorName,value=>{
  const name=value.trim();if(!name||name.length>40){toast('请输入 1—40 字的姓名');return;}
  editorName=name;try{localStorage.setItem('timeline-editor-name',name);}catch(e){}
  const label=$('sharedEditor');if(label)label.textContent='编辑人：'+editorName+'（填写）';
  if(saveQueue&&sharedDraft&&sharedDraft.revision===saveQueue.revision&&!saveQueue.dirty&&!saveQueue.error){sharedNotice='';saveQueue.enqueue({timeline:data,editor:editorName});}
  after?.();
 });
}
function versionLabel(record){
 const time=record.updatedAt?new Date(record.updatedAt).toLocaleString('zh-CN',{hour12:false}):'尚未保存';
 return `${record.updatedBy||'未记录'} · ${time} · ${record.summary||'修改项目'}`;
}
async function openSharedHistory(){
 let panel=$('timelineHistory');
 if(!panel){panel=document.createElement('div');panel.id='timelineHistory';panel.className='dialog-backdrop';document.body.append(panel);}
 panel.replaceChildren();panel.classList.add('show');historyOpen=true;
 const box=document.createElement('div');box.style.cssText='background:white;border-radius:12px;padding:20px;width:1100px;max-width:95vw;max-height:90vh;overflow:auto';panel.append(box);
 const close=document.createElement('button');close.textContent='关闭历史记录';close.style.float='right';close.onclick=()=>{panel.classList.remove('show');historyOpen=false;};box.append(close);
 const heading=document.createElement('h3');heading.textContent='历史记录 · 最近 100 个版本';box.append(heading);
 const note=document.createElement('p');note.textContent='姓名由编辑人填写；查看或下载旧版本不会影响共享项目。恢复会生成一个新版本，保留现有历史。';note.className='subtle';box.append(note);
 const rows=document.createElement('div');box.append(rows);
 const preview=document.createElement('div');box.append(preview);
 try{
  const response=await fetch('/api/history',{cache:'no-store'});if(!response.ok)throw new Error('读取历史记录失败');
  const result=await response.json();
  for(const version of result.versions){
   const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee';
   const label=document.createElement('span');label.style.flex='1';label.textContent=(version.revision===saveQueue.revision?'[当前] ':'')+versionLabel(version);row.append(label);
   const show=document.createElement('button');show.textContent='查看版本';row.append(show);rows.append(row);
   show.onclick=async()=>{
    show.disabled=true;
    try{
     const response=await fetch('/api/history/'+encodeURIComponent(version.revision),{cache:'no-store'});if(!response.ok)throw new Error('读取版本失败');
     const record=await response.json();preview.replaceChildren();
     const title=document.createElement('h4');title.textContent=versionLabel(record);preview.append(title);
     const download=document.createElement('button');download.textContent='下载此版本 JSON';download.onclick=()=>downloadFile('时间轴_'+record.revision.slice(0,8)+'.json',JSON.stringify(record.timeline,null,2),'application/json;charset=utf-8');preview.append(download);
     const restore=document.createElement('button');restore.textContent='恢复此版本';restore.disabled=record.revision===saveQueue.revision;preview.append(restore);
     restore.onclick=()=>{
      const perform=async()=>{
       if(saveQueue.dirty||saveQueue.error||sharedDraft||syncBusy){toast('请先处理当前保存或草稿，再恢复历史版本');return;}
       if(!confirm('恢复此历史版本？当前版本会保留在历史记录中。'))return;
       restore.disabled=true;syncBusy=true;
       try{
        await sharedRequest('PUT',{revision:saveQueue.revision,restoreRevision:record.revision,editor:editorName});
        const result=await sharedRequest();data=result.timeline;sharedMeta=result;normalizeMonths();
        history=[];future=[];selection=null;saveQueue.reset(result.revision);updateHistory();render();
        panel.classList.remove('show');historyOpen=false;toast('已恢复历史版本，并记录本次操作');
       }catch(e){toast('恢复失败：'+e.message);}finally{restore.disabled=false;syncBusy=false;}
      };
      if(!editorName)askEditor(perform);else perform();
     };
     const current=data;let svgText;
     try{data=clone(record.timeline);normalizeMonths();svgText=exportSvgString();}finally{data=current;}
     const drawing=new DOMParser().parseFromString(svgText,'image/svg+xml').documentElement;drawing.style.cssText='width:100%;height:auto;max-height:500px;margin-top:12px;border:1px solid #eee';preview.append(drawing);
     preview.scrollIntoView({behavior:'smooth',block:'nearest'});
    }catch(e){toast(e.message);}finally{show.disabled=false;}
   };
  }
 }catch(e){rows.textContent=e.message;}
}

function startSharedSync(){
 const bar=document.createElement('div');bar.id='sharedSync';bar.style.cssText='display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 18px;background:#eef6ff;border-bottom:1px solid #cadcf3;font-size:13px';
 const status=document.createElement('span');status.setAttribute('role','status');status.style.flex='1';
 const download=document.createElement('button');download.textContent='下载本机草稿';
 const latest=document.createElement('button');latest.textContent='加载最新版本';
 const retry=document.createElement('button');retry.textContent='重试保存';
 const editor=document.createElement('button');editor.id='sharedEditor';editor.textContent=editorName?'编辑人：'+editorName+'（填写）':'填写编辑姓名';editor.onclick=()=>askEditor();
 const versions=document.createElement('button');versions.textContent='历史记录';versions.onclick=openSharedHistory;
 bar.append(status,editor,versions,download,latest,retry);document.querySelector('.workspace').before(bar);
 document.querySelector('.brand-sub').textContent='项目时间轴 · 修改自动保存到服务器';
 $('reset').hidden=true;
 function keepDraft(){
  if(saveQueue.dirty)sharedDraft={revision:saveQueue.revision,timeline:clone(data),editor:editorName};
  else if(!saveQueue.error)sharedDraft=null;
  try{if(sharedDraft)localStorage.setItem(draftKey,JSON.stringify(sharedDraft));else localStorage.removeItem(draftKey);}catch(e){}
 }
 function update(){
  keepDraft();
  status.textContent=saveQueue.error?(saveQueue.error.status===409?'保存冲突：其他人已更新。请下载草稿，再加载最新版本。':'保存失败：修改仍在本机，请重试或下载草稿。'):saveQueue.dirty?'正在保存到服务器…':sharedNotice||('已保存 · '+versionLabel(sharedMeta));
  bar.style.background=saveQueue.error?'#fff1e6':'#eef6ff';
  retry.hidden=!saveQueue.error||saveQueue.error.status===409;
  latest.disabled=saveQueue.running||syncBusy;
 }
 saveQueue=new SaveQueue(async payload=>{const result=await sharedRequest('PUT',payload);sharedMeta=result;return result;},update);
 saveQueue.revision=serverRevision;
 const recovered=sharedDraft;
 download.onclick=()=>downloadFile((data.title||'时间轴')+'_本机草稿.json',JSON.stringify(sharedDraft?.timeline||data,null,2),'application/json;charset=utf-8');
 retry.onclick=()=>{sharedNotice='';saveQueue.retry();};
 latest.onclick=async()=>{
  if(saveQueue.running||syncBusy)return;
  if(saveQueue.dirty||sharedDraft)download.onclick();
  syncBusy=true;latest.disabled=true;setEditing(false);
  try{
   const result=await sharedRequest();if(!result.timeline)throw new Error('服务器尚无项目');
   data=result.timeline;sharedMeta=result;normalizeMonths();history=[];future=[];selection=null;sharedNotice='';
   saveQueue.reset(result.revision);updateHistory();render();
  }catch(e){toast('加载失败：'+e.message);}finally{syncBusy=false;latest.disabled=false;}
 };
 window.addEventListener('beforeunload',ev=>{if(saveQueue.dirty||saveQueue.error){ev.preventDefault();ev.returnValue='';}});
 if(recovered&&recovered.revision===serverRevision&&editorName){sharedNotice='';saveQueue.enqueue({timeline:data,editor:editorName});}
 else{
  // Preserve an older local draft until the user explicitly loads the latest version.
  status.textContent=sharedNotice||('已保存 · '+versionLabel(sharedMeta));retry.hidden=true;
 }
 function idle(){return !saveQueue.dirty&&!saveQueue.error&&!drag&&!arrowStart&&!syncBusy&&!historyOpen&&!$('dialogBack').classList.contains('show')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);}
 setInterval(async()=>{
  if(!idle())return;
  const revision=saveQueue.revision;syncBusy=true;
  try{
   const result=await sharedRequest();
   syncBusy=false;
   if(!idle()||saveQueue.revision!==revision||result.revision===revision||!result.timeline)return;
   data=result.timeline;sharedMeta=result;normalizeMonths();saveQueue.revision=result.revision;
   history=[];future=[];selection=null;updateHistory();render();
   status.textContent='已同步 · '+versionLabel(sharedMeta);
  }catch(e){status.textContent='暂时无法获取最新进度，将自动重试';}finally{syncBusy=false;}
 },5000);
}

setEditing(false);fit();
if(sharedMode)startSharedSync();else{document.querySelector('.brand-sub').textContent='一个文件即可查看 · 无需安装 · 编辑数据保存在本机';$('reset').hidden=false;}
})();
</script>
</body>
